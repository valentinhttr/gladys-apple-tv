# -----------------------------------------------------------------------------
# Build and publish the multi-architecture image to ghcr.io.
#
# Triggers:
#   - a `vX.Y.Z` tag pushed by hand           -> release build;
#   - a manual run (workflow_dispatch)        -> test build, never tagged latest;
#   - called by release.yml (workflow_call)   -> release build of the version it
#     just bumped and tagged. A tag pushed with the default GITHUB_TOKEN does
#     not trigger the `push: tags` build above, hence the direct call.
#
# linux/amd64 + linux/arm64: Gladys runs on Raspberry Pi as much as on x86.
# -----------------------------------------------------------------------------
name: Build and publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to publish (defaults to the branch name)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve the tags to publish
        id: tags
        env:
          CALLED_VERSION: ${{ inputs.version }}
          MANUAL_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [ -n "${CALLED_VERSION}" ]; then
            version="${CALLED_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Manual run: a throwaway tag, and never `latest`. `release` stays
            # empty, so the store validation below is skipped — the manifest
            # points at a version this run is not publishing.
            version="${MANUAL_TAG:-${GITHUB_REF_NAME//\//-}}"
            echo "tags=${image}:${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${version},${image}:latest" >> "$GITHUB_OUTPUT"

      # Gladys reads the manifest from this label when an integration is
      # installed by image name instead of from the store, so a released tag
      # can be installed by hand the same way the dev one is.
      - name: Read the manifest into a label
        id: manifest
        run: echo "json=$(jq -c . gladys-assistant-integration.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            io.gladysassistant.manifest=${{ steps.manifest.outputs.json }}

      # Runs HERE and nowhere else: the store validator pulls `docker_image` to
      # check it is publicly available, so it can only pass once the image of
      # THIS version exists. Running it in CI, or before this build, would fail
      # on every new version by construction.
      - name: Set up Node.js
        if: steps.tags.outputs.release != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate the Gladys store admission rules
        if: steps.tags.outputs.release != ''
        run: npx --yes github:GladysAssistant/integration-store .
