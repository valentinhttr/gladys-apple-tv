# -----------------------------------------------------------------------------
# Continuous integration: runs on every push and every pull request.
#
# Three gates:
#   1. Prettier  -> consistent formatting;
#   2. ESLint    -> real mistakes (undefined vars, dead code, ...);
#   3. Tests     -> `node --test` plus a compile of the Python worker. The
#                   manifest is covered there too (test/manifest.test.js ties it
#                   to the code that has to honour it).
#
# The official store admission check lives in build.yml instead: it pulls
# `docker_image` to prove it is public, so it can only pass once the image of
# the current version has been published.
#
# Node 24 and Python 3.11 mirror the runtimes of the Docker image.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint and test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  image:
    runs-on: ubuntu-latest
    name: Build the image
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      # amd64 only here: it proves the Dockerfile builds and that pyatv and the
      # worker load in the image (the self-test in the Dockerfile). The arm64
      # build happens at release time.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
